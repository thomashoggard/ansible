- name: Enable wezterm copr repo
  tags:
    - fedora
  become: true
  community.general.copr:
    state: enabled
    name: wezfurlong/wezterm-nightly

- name: Enable lazygit copr repo
  tags:
    - fedora
  become: true
  community.general.copr:
    state: enabled
    name: atim/lazygit

- name: Install terminal apps
  become: true
  package:
    name:
      - neovim
      - fzf
      - ripgrep
      - jq
      - lazygit
      - luarocks
      - btop
      - wezterm
      - restic
    state: latest
